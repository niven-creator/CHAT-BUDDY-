<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHAT BUDDY</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #080d18;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.container {
  background: #111c30;
  padding: 35px;
  border-radius: 20px;
  width: 85%;
  max-width: 400px;
  text-align: center;
}
.logo {
  font-size: 55px;
  background: #1677ff;
  width: 85px;
  height: 85px;
  line-height: 85px;
  border-radius: 25px;
  margin: auto;
}
h1 {
  color: #ffffff;
  letter-spacing: 3px;
}
p {
  color: #a9bbd5;
}
button {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: none;
  border-radius: 12px;
  background: #1677ff;
  color: white;
  font-size: 16px;
  cursor: pointer;
}
.secondary {
  background: transparent;
  border: 1px solid #1677ff;
}
</style>
</head>
<body>

<div class="container">
  <div class="logo">🤖</div>
  <h1>CHAT BUDDY</h1>
  <p>Your AI. Your buddy. Always ready to help.</p>

  <h2>Welcome!</h2>
  <p>Sign in or create your account to continue.</p>

  <button onclick="alert('Sign in coming soon!')">
    Sign in
  </button>

  <button class="secondary" onclick="alert('Account creation coming soon!')">
    Create an account
  </button>
</div>

</body>
</html>
